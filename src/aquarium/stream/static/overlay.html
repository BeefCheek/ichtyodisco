<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ichtyodisco Overlay</title>
<!-- OBS: Sources > Browser > URL http://localhost:8765/overlay, 520x200, transparent background -->
<style>
  :root { --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --s1: #3987e5; --panel: rgba(13,13,13,0.62); }
  html, body { margin: 0; background: transparent; color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .w { display: inline-grid; gap: 6px; padding: 12px 16px; background: var(--panel); border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10); min-width: 360px; max-width: 520px; }
  .top { display: flex; align-items: baseline; gap: 12px; }
  .mood { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .n { color: var(--ink-2); }
  .gauge { position: relative; height: 8px; background: rgba(255,255,255,0.10); border-radius: 4px; }
  .gauge .band { position: absolute; left: 33.3%; width: 33.3%; top: 0; bottom: 0; background: rgba(57,135,229,0.35); }
  .gauge .dot { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink);
    transform: translateX(-50%); transition: left .8s; left: 50%; }
  .row { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ev { color: var(--ink); font-size: 14px; min-height: 1.4em; transition: opacity .4s; }
</style>
</head>
<body>
<div class="w">
  <div class="top"><span class="mood" id="mood">…</span><span class="n" id="n"></span></div>
  <div class="row"><span>activité vs normale de cette heure</span><span id="act"></span></div>
  <div class="gauge"><div class="band"></div><div class="dot" id="dot"></div></div>
  <div class="ev" id="ev"></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const es = new EventSource("/api/live");
  es.onmessage = (m) => {
    const s = JSON.parse(m.data), z = (s.zscores || {}).activity;
    $("#mood").textContent = (s.mood || {}).label || "…";
    $("#n").textContent = `${s.fish_count} poisson${s.fish_count > 1 ? "s" : ""}`;
    $("#act").textContent = z === undefined ? "apprentissage…" : `${z >= 0 ? "+" : ""}${z.toFixed(1)}σ`;
    $("#dot").style.left = (50 + Math.max(-1, Math.min(1, (z || 0) / 3)) * 50) + "%";
    const e = (s.recent_events || [])[0];
    if (e && Date.now() / 1000 - e.timestamp < 120) { $("#ev").textContent = "● " + e.message; $("#ev").style.opacity = 1; }
    else $("#ev").style.opacity = 0;
  };
</script>
</body>
</html>
